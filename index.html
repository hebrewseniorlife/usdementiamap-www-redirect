<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>US Dementia Map</title>
  <!-- www.usdementiamap.org only redirects; search engines should index the bare domain -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://usdementiamap.org/">
  <!-- keep the path, query string (e.g. utm_ tags) and fragment the visitor arrived with -->
  <script>
    location.replace("https://usdementiamap.org" + location.pathname + location.search + location.hash);
  </script>
  <!-- fallback when JavaScript is off -->
  <meta http-equiv="refresh" content="0; url=https://usdementiamap.org/">
</head>
<body>
  <p>The US Dementia Map is at <a href="https://usdementiamap.org/">usdementiamap.org</a>.</p>
</body>
</html>
